name: Daily US stocks report

on:
  schedule:
    # 23:00 UTC, Monday to Friday: well after the US close (21:00 UTC in winter, 20:00 UTC in summer)
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the report only, no Telegram, no publish"
        type: boolean
        default: false
      force_send:
        description: "Send even if this data date was already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stocks-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stocks_report/requirements.txt

      - run: pip install -r stocks_report/requirements.txt

      - name: Build report, send Telegram, write public/reports
        env:
          DATA_SOURCE: tiingo
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.STOCKS_TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          FORCE_SEND: ${{ inputs.force_send && 'true' || 'false' }}
          USE_AI_COMMENTARY: "false"
          WORKSHUB_LOCAL_DIR: public/reports
        run: python stocks_report/daily_report.py

      - name: Commit reports
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reports
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update 美股日報 $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy to Cloudflare
        if: ${{ !inputs.dry_run && env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
