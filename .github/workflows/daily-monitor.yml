name: Daily market monitor

on:
  schedule:
    # 06:30 UTC, Tuesday to Saturday: after the previous US trading day has closed
    - cron: "30 6 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: wh-state-${{ github.run_id }}
          restore-keys: wh-state-

      - name: Update market monitor
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python scripts/update_monitor.py

      - name: Save price history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: wh-state-${{ github.run_id }}

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --staged --quiet || (git commit -m "Update market monitor" && git pull --rebase && git push)

      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
