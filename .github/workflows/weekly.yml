name: Weekly summary

on:
  schedule:
    # Sunday evening, then two retries (Sunday night and Monday morning). The script writes the most
    # recent Sunday-ending week and skips a week that already exists.
    - cron: "0 18 * * 0"
    - cron: "30 21 * * 0"
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests trafilatura
      - name: Write weekly summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_weekly.py
      - name: Commit data.json
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --staged --quiet || (git commit -m "Update weekly summary" && git pull --rebase && git push)
      - name: Deploy to Cloudflare
        if: ${{ always() && env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
