name: Daily VCP scan

on:
  schedule:
    # 07:00 UTC, Tuesday to Saturday: after the previous US trading day has closed and after the daily monitor
    - cron: "0 7 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vcp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # the first run backfills about 320 trading days at 5 Polygon calls a minute (about 70 minutes)
    timeout-minutes: 180
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: state_vcp
          key: wh-vcp-state-${{ github.run_id }}
          restore-keys: wh-vcp-state-

      - name: Scan
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python scripts/update_vcp.py

      - name: Save price history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state_vcp
          key: wh-vcp-state-${{ github.run_id }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vcp
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update VCP scan $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
