name: daily-market-monitor

on:
  schedule:
    # 美股收市後約 1.5 小時（UTC 22:30，週一至週五）。夏令/冬令都夠遲。
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 計算、出網頁、發預警
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python monitor.py
      - name: 儲存結果
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "更新 $(date -u +%F)"
          git push
